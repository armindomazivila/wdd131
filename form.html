<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form for WDD 131 Web Fundamentals courses.">
    <meta name="author" content="Armindo Armando Mazivila">
    <title>Product Review Form | WDD 131</title>

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css" media="screen and (min-width: 700px)">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <fieldset>
                <legend>Product Information</legend>

                <label for="product">
                    Product Name <span class="required">*</span>
                </label>

                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Overall Rating <span class="required">*</span></legend>

                <div class="rating">
                    <label for="rating1">
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <label for="rating1">☆</label>
                        <span class="sr-only">1 star</span>
                    </label>

                    <label for="rating2">
                        <input type="radio" id="rating2" name="rating" value="2">
                        <label for="rating2">☆☆</label>
                        <span class="sr-only">2 stars</span>
                    </label>

                    <label for="rating3">
                        <input type="radio" id="rating3" name="rating" value="3">
                        <label for="rating3">☆☆☆</label>
                        <span class="sr-only">3 stars</span>
                    </label>

                    <label for="rating4">
                        <input type="radio" id="rating4" name="rating" value="4">
                        <label for="rating4">☆☆☆☆</label>
                        <span class="sr-only">4 stars</span>
                    </label>

                    <label for="rating5">
                        <input type="radio" id="rating5" name="rating" value="5">
                        <label for="rating5">☆☆☆☆☆</label>
                        <span class="sr-only">5 stars</span>
                    </label>
                </div>
            </fieldset>

            <fieldset>
                <legend>
                    Date of Installation <span class="required">*</span>
                </legend>

                <label for="installDate">Installation Date</label>
                <input type="date" id="installDate" name="installDate" required>
            </fieldset>

            <fieldset>
                <legend>Useful Features</legend>

                <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="durability">
                    Durability
                </label>

                <label for="ease">
                    <input type="checkbox" id="ease" name="features" value="ease">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design" name="features" value="design">
                    Design
                </label>
            </fieldset>

            <fieldset>
                <legend>Written Review</legend>

                <label for="review">Your Review</label>
                <textarea id="review" name="review" rows="6" placeholder="Write your review here..."></textarea>
            </fieldset>

            <fieldset>
                <legend>User Information</legend>

                <label for="username">Your Name (optional)</label>
                <input type="text" id="username" name="username" autocomplete="name">
            </fieldset>

            <input type="submit" value="Submit Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Armindo Armando Mazivila - Mozambique</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
