<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Product review confirmation page for WDD 131.">

    <meta name="author" content="Armindo Armando Mazivila">

    <title>Review Submitted | WDD 131</title>

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main class="confirmation">
        <section>
            <h2>Thank You!</h2>

            <p>Your product review has been successfully submitted.</p>

            <p>
                You have completed
                <strong id="reviewCount">0</strong>
                review(s).
            </p>

            <a href="form.html" class="button">Write Another Review</a>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Armindo Armando Mazivila - Mozambique</p>
        <p id="lastModified"></p>
    </footer>

    <script>
        let reviewCount = Number(localStorage.getItem("reviewCount")) || 0;

        reviewCount++;

        localStorage.setItem("reviewCount", reviewCount);

        document.querySelector("#reviewCount").textContent = reviewCount;

        document.querySelector("#currentyear").textContent =
            new Date().getFullYear();

        document.querySelector("#lastModified").textContent =
            `Last Modification: ${document.lastModified}`;
    </script>
</body>

</html>
